<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estado del Paso de Agua Negra</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
  --bg: #000000;
  --card: #0b0d0f;
  --text: #e8ebee;
  --muted: #9aa4af;
  --border: #2b3138;
  --verde: #3fb950;
  --rojo: #ff6b6b;
  --aviso-bg: #2a2410;
  --aviso-border: #8a7021;
  --enlace: #6cb6ff;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  box-sizing: border-box;
}
main {
  width: 100%; max-width: 560px; text-align: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 40px 24px;
}
h1 { font-size: 1.4rem; margin: 0 0 4px; }
.lugar { color: var(--muted); margin: 0 0 32px; font-size: .95rem; }
.etiqueta { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
#estado { font-size: clamp(2.6rem, 14vw, 4.5rem); font-weight: 800; margin: 0; line-height: 1.1; }
#estado.abierto { color: var(--verde); }
#estado.cerrado { color: var(--rojo); }
.fecha { color: var(--muted); font-size: .85rem; margin: 16px 0 32px; }
.aviso {
  background: var(--aviso-bg); border: 1px solid var(--aviso-border);
  border-radius: 10px; padding: 14px 16px; font-size: .95rem; line-height: 1.45;
  text-align: left;
}
.contacto { margin: 24px 0 0; font-size: .95rem; color: var(--muted); line-height: 1.5; }
.contacto a { color: var(--enlace); word-break: break-all; }
#panel { margin-top: 32px; padding-top: 20px; border-top: 1px dashed var(--border); }
#panel h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
#panel .botones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
#panel button {
  background: transparent; font: inherit; font-weight: 700; cursor: pointer;
  padding: 10px 18px; border-radius: 10px; border: 2px solid currentColor;
}
#panel .b-abierto { color: var(--verde); }
#panel .b-cerrado { color: var(--rojo); }
#panel button:disabled { opacity: .5; cursor: default; }
#panel .msg { color: var(--muted); font-size: .85rem; margin: 12px 0 0; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>Paso de Agua Negra</h1>
  <p class="lugar">San Juan, Argentina</p>
  <p class="etiqueta">Estado actual para realizar montañismo</p>
  <p id="estado" class="cerrado">CERRADO</p>
  <p class="fecha" id="fecha"></p>
  <div class="aviso">
    <strong>Importante:</strong> siempre se deben seguir las recomendaciones y avisos de Gendarmería Nacional.
  </div>
  <p class="contacto">Contacto de Gendarmería Nacional:<br><a href="mailto:esc25-jachal@gendarmeria.gob.ar">esc25-jachal@gendarmeria.gob.ar</a></p>
</main>
<script type="application/json" id="datos">{"estado":"cerrado","actualizado":"2 de noviembre de 2026"}</script>
<script>
(function () {
  var datos = JSON.parse(document.getElementById("datos").textContent);
  var elEstado = document.getElementById("estado");
  var elFecha = document.getElementById("fecha");

  function pintar(d) {
    var abierto = d.estado === "abierto";
    elEstado.textContent = abierto ? "ABIERTO" : "CERRADO";
    elEstado.className = abierto ? "abierto" : "cerrado";
    elFecha.textContent = "Última actualización: " + d.actualizado;
  }
  pintar(datos);

  function hoy() {
    return new Date().toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
  }

  function armarDocumento(d) {
    var clon = document.documentElement.cloneNode(true);
    var p = clon.querySelector("#panel");
    if (p) p.remove();
    clon.querySelector("#datos").textContent = JSON.stringify(d);
    var e = clon.querySelector("#estado");
    e.textContent = d.estado === "abierto" ? "ABIERTO" : "CERRADO";
    e.className = d.estado;
    clon.querySelector("#fecha").textContent = "Última actualización: " + d.actualizado;
    return "<!DOCTYPE html>\n" + clon.outerHTML;
  }

  async function iniciarPanel() {
    try {
      var user = await window.claude.use("user");
      if (!user || !user.isOwner()) return;
      var art = await window.claude.use("artifact");
      if (!art) return;

      var panel = document.createElement("section");
      panel.id = "panel";
      panel.innerHTML =
        '<h2>Panel del administrador</h2>' +
        '<div class="botones">' +
        '<button type="button" class="b-abierto">Marcar ABIERTO</button>' +
        '<button type="button" class="b-cerrado">Marcar CERRADO</button>' +
        '</div><p class="msg"></p>';
      document.querySelector("main").appendChild(panel);

      var msg = panel.querySelector(".msg");
      var botones = panel.querySelectorAll("button");

      async function guardar(estado) {
        botones.forEach(function (b) { b.disabled = true; });
        msg.textContent = "Guardando…";
        try {
          await art.publish(armarDocumento({ estado: estado, actualizado: hoy() }));
        } catch (err) {
          msg.textContent = "No se pudo guardar (" + ((err && err.code) || "error") + ").";
          botones.forEach(function (b) { b.disabled = false; });
        }
      }
      panel.querySelector(".b-abierto").addEventListener("click", function () { guardar("abierto"); });
      panel.querySelector(".b-cerrado").addEventListener("click", function () { guardar("cerrado"); });
    } catch (e) { /* sin panel */ }
  }

  if (window.claude && window.claude.use) iniciarPanel();
})();
</script>
</body>
</html>
